<script>
function parseNum(val) {
  if (!val) return 0;
  val = val.trim().replace(/,/g, '');
  if (val.endsWith('万')) {
    const num = parseFloat(val.replace('万', ''));
    return isNaN(num) ? 0 : Math.round(num * 10000);
  }
  const num = parseFloat(val);
  return isNaN(num) ? 0 : num;
}

function fmtDayPt(pt) {
  const floorPt = Math.floor(pt);
  if (floorPt >= 10000) {
    return `${(floorPt / 10000).toFixed(2)}万 pt`;
  }
  return `${floorPt.toLocaleString()} pt`;
}

function saveInputs() {
  const inputs = document.querySelectorAll('.save-input');
  inputs.forEach(input => {
    localStorage.setItem('moman_' + input.id, input.value);
  });
}

function loadInputs() {
  const inputs = document.querySelectorAll('.save-input');
  inputs.forEach(input => {
    const savedVal = localStorage.getItem('moman_' + input.id);
    if (savedVal !== null) {
      input.value = savedVal;
    }
  });
}

function clearAll() {
  if (confirm('すべての入力数値をクリア（リセット）しますか？')) {
    const inputs = document.querySelectorAll('.save-input');
    inputs.forEach(input => {
      input.value = '';
      localStorage.removeItem('moman_' + input.id);
    });
    calc();
  }
}

function calc() {
  saveInputs();

  // --- 1日目 ---
  const d1_sendenN = parseNum(document.getElementById('d1_senden').value);
  const d1_sendenPt = d1_sendenN * 44.5;
  const d1_flowerN = parseNum(document.getElementById('d1_flower').value);
  const d1_flowerPt = d1_flowerN * 10;
  const d1_kanzashiN = parseNum(document.getElementById('d1_kanzashi').value);
  const d1_kanzashiPt = d1_kanzashiN * 30;
  const d1_gyokuN = parseNum(document.getElementById('d1_gyoku').value);
  const d1_gyokuPt = d1_gyokuN * 100;
  const d1_shipPt = 12000;
  const d1_nightFixedPt = 25098;
  const d1_tsuboN = parseNum(document.getElementById('d1_tsubo').value);
  const d1_tsuboPt = d1_tsuboN * 20;
  const d1_total = d1_nightFixedPt + d1_sendenPt + d1_flowerPt + d1_kanzashiPt + d1_gyokuPt + d1_shipPt + d1_tsuboPt;

  // --- 2日目 ---
  const d2_tribN = parseNum(document.getElementById('d2_trib').value);
  const d2_tribCount = Math.floor(d2_tribN / 100);
  const d2_tribPt = d2_tribCount * 25;
  const d2_sandN = parseNum(document.getElementById('d2_sand').value);
  const d2_sandTribTotal = d2_sandN * 57;
  const d2_sandCount = Math.floor(d2_sandTribTotal / 100);
  const d2_sandPt = d2_sandCount * 25;
  const d2_toramokuN = parseNum(document.getElementById('d2_toramoku').value);
  const d2_toramokuPt = d2_toramokuN * 10;
  const d2_staminaN = parseNum(document.getElementById('d2_stamina').value);
  const d2_staminaPt = d2_staminaN * 20;
  const d2_nikumanN = parseNum(document.getElementById('d2_nikuman').value);
  const d2_nikumanPt = d2_nikumanN * 3 * 20;
  const d2_tsuboN = parseNum(document.getElementById('d2_tsubo').value);
  const d2_tsuboPt = d2_tsuboN * 20;
  const d2_total = d2_tribPt + d2_sandPt + d2_toramokuPt + d2_staminaPt + d2_nikumanPt + d2_tsuboPt;

  // --- 3日目 ---
  const d3_hyakkoN = parseNum(document.getElementById('d3_hyakko').value);
  const d3_hyakkoPt = d3_hyakkoN * 3;
  const d3_tenkoN = parseNum(document.getElementById('d3_tenko').value);
  const d3_tenkoPt = d3_tenkoN * 2;
  const d3_resAccN = parseNum(document.getElementById('d3_res_acc').value);
  const d3_resAccPt = d3_resAccN * 2.4;
  const d3_res60N = parseNum(document.getElementById('d3_res_card_60').value);
  const d3_res60Pt = d3_res60N * 18;
  const d3_res1N = parseNum(document.getElementById('d3_res_card_1').value);
  const d3_res1Pt = d3_res1N * 0.3;
  const d3_fixedPt = 396;
  const d3_tsuboN = parseNum(document.getElementById('d3_tsubo').value);
  const d3_tsuboPt = d3_tsuboN * 20;
  const d3_total = d3_hyakkoPt + d3_tenkoPt + d3_resAccPt + d3_res60Pt + d3_res1Pt + d3_fixedPt + d3_tsuboPt;

  // --- 4日目 ---
  const d4_advisorN = parseNum(document.getElementById('d4_advisor').value);
  const d4_advisorPt = d4_advisorN * 3;
  const d4_landCertN = parseNum(document.getElementById('d4_land_cert').value);
  const d4_landCertPt = d4_landCertN * 5;
  const d4_patrolN = parseNum(document.getElementById('d4_patrol').value);
  const d4_patrolPt = d4_patrolN * 11.2;
  const d4_conquestN = parseNum(document.getElementById('d4_conquest').value);
  const d4_conquestPt = d4_conquestN * 19.625;
  const d4_tsuboN = parseNum(document.getElementById('d4_tsubo').value);
  const d4_tsuboPt = d4_tsuboN * 20;
  const d4_total = d4_advisorPt + d4_landCertPt + d4_patrolPt + d4_conquestPt + d4_tsuboPt;

  // --- 5日目 ---
  const d5_kangakuN = parseNum(document.getElementById('d5_kangaku').value);
  const d5_kangakuPt = d5_kangakuN * 4.1;
  const d5_詔書N = parseNum(document.getElementById('d5_詔書').value);
  const d5_詔書Pt = d5_詔書N * 10;
  const d5_shipPt = 12000;
  const d5_tsuboN = parseNum(document.getElementById('d5_tsubo').value);
  const d5_tsuboPt = d5_tsuboN * 20;
  const d5_total = d5_kangakuPt + d5_詔書Pt + d5_shipPt + d5_tsuboPt;

  // --- 6日目 ---
  const d6_fixedPt = 10000;
  const d6_fukuryoN = parseNum(document.getElementById('d6_fukuryo').value);
  const d6_fukuryoPt = d6_fukuryoN * 25;
  const d6_flowerN = parseNum(document.getElementById('d6_flower').value);
  const d6_flowerPt = d6_flowerN * 10;
  const d6_kanzashiN = parseNum(document.getElementById('d6_kanzashi').value);
  const d6_kanzashiPt = d6_kanzashiN * 30;
  const d6_gyokuN = parseNum(document.getElementById('d6_gyoku').value);
  const d6_gyokuPt = d6_gyokuN * 100;
  const d6_toramokuN = parseNum(document.getElementById('d6_toramoku').value);
  const d6_toramokuPt = d6_toramokuN * 10;
  const d6_brickN = parseNum(document.getElementById('d6_brick').value);
  const d6_brickPt = d6_brickN * 200;
  const d6_compassN = parseNum(document.getElementById('d6_compass').value);
  const d6_compassPt = d6_compassN * 20;
  const d6_talismanN = parseNum(document.getElementById('d6_talisman').value);
  const d6_talismanPt = d6_talismanN * 20;
  const d6_tsuboN = parseNum(document.getElementById('d6_tsubo').value);
  const d6_tsuboPt = d6_tsuboN * 20;
  const d6_total = d6_fixedPt + d6_fukuryoPt + d6_flowerPt + d6_kanzashiPt + d6_gyokuPt + d6_toramokuPt + d6_brickPt + d6_compassPt + d6_talismanPt + d6_tsuboPt;

  document.getElementById('d1_tsubo-p').innerText = d1_tsuboN ? `${d1_tsuboN.toLocaleString()}個 ➔ ${d1_tsuboPt.toLocaleString()} pt` : '';

  document.getElementById('d2_toramoku-p').innerText = d2_toramokuN ? `${d2_toramokuN.toLocaleString()}個 ➔ ${d2_toramokuPt.toLocaleString()} pt` : '';
  document.getElementById('d2_stamina-p').innerText = d2_staminaN ? `${d2_staminaN.toLocaleString()} ➔ ${d2_staminaPt.toLocaleString()} pt` : '';

  document.getElementById('d2_tsubo-p').innerText = d2_tsuboN ? `${d2_tsuboN.toLocaleString()}個 ➔ ${d2_tsuboPt.toLocaleString()} pt` : '';

  document.getElementById('d3_hyakko-p').innerText = d3_hyakkoN ? `${d3_hyakkoN.toLocaleString()}個 ➔ ${d3_hyakkoPt.toLocaleString()} pt` : '';
  document.getElementById('d3_tenko-p').innerText = d3_tenkoN ? `${d3_tenkoN.toLocaleString()}個 ➔ ${d3_tenkoPt.toLocaleString()} pt` : '';
  document.getElementById('d3_res_acc-p').innerText = d3_resAccN ? `${d3_resAccN.toLocaleString()}分 ➔ ${d3_resAccPt.toFixed(1)} pt` : '';

  document.getElementById('d3_tsubo-p').innerText = d3_tsuboN ? `${d3_tsuboN.toLocaleString()}個 ➔ ${d3_tsuboPt.toLocaleString()} pt` : '';

  document.getElementById('d4_advisor-p').innerText = d4_advisorN ? `${d4_advisorN.toLocaleString()}回 ➔ ${d4_advisorPt.toLocaleString()} pt` : '';
  document.getElementById('d4_land_cert-p').innerText = d4_landCertN ? `${d4_landCertN.toLocaleString()}枚 ➔ ${d4_landCertPt.toLocaleString()} pt` : '';
  document.getElementById('d4_patrol-p').innerText = d4_patrolN ? `${d4_patrolN.toLocaleString()}回 ➔ ${d4_patrolPt.toFixed(1)} pt` : '';
  document.getElementById('d4_conquest-p').innerText = d4_conquestN ? `${d4_conquestN.toLocaleString()}章 ➔ ${d4_conquestPt.toFixed(2)} pt` : '';

  document.getElementById('d5_kangaku-p').innerText = d5_kangakuN ? `${d5_kangakuN.toLocaleString()}枚(育成${(d5_kangakuN*410).toLocaleString()}人) ➔ ${d5_kangakuPt.toFixed(1)} pt` : '';
  document.getElementById('d5_詔書-p').innerText = d5_詔書N ? `${d5_詔書N.toLocaleString()}個 ➔ ${d5_詔書Pt.toLocaleString()} pt` : '';
  document.getElementById('d5_tsubo-p').innerText = d5_tsuboN ? `${d5_tsuboN.toLocaleString()}個 ➔ ${d5_tsuboPt.toLocaleString()} pt` : '';

  document.getElementById('d6_fukuryo-p').innerText = d6_fukuryoN ? `${d6_fukuryoN.toLocaleString()}個 ➔ ${d6_fukuryoPt.toLocaleString()} pt` : '';
  document.getElementById('d6_flower-p').innerText = d6_flowerN ? `${d6_flowerN.toLocaleString()}個 ➔ ${d6_flowerPt.toLocaleString()} pt` : '';
  document.getElementById('d6_kanzashi-p').innerText = d6_kanzashiN ? `${d6_kanzashiN.toLocaleString()}個 ➔ ${d6_kanzashiPt.toLocaleString()} pt` : '';
  document.getElementById('d6_gyoku-p').innerText = d6_gyokuN ? `${d6_gyokuN.toLocaleString()}個 ➔ ${d6_gyokuPt.toLocaleString()} pt` : '';
  document.getElementById('d6_toramoku-p').innerText = d6_toramokuN ? `${d6_toramokuN.toLocaleString()}個 ➔ ${d6_toramokuPt.toLocaleString()} pt` : '';
  document.getElementById('d6_brick-p').innerText = d6_brickN ? `${d6_brickN.toLocaleString()}個 ➔ ${d6_brickPt.toLocaleString()} pt` : '';
  document.getElementById('d6_compass-p').innerText = d6_compassN ? `${d6_compassN.toLocaleString()}個 ➔ ${d6_compassPt.toLocaleString()} pt` : '';
  document.getElementById('d6_talisman-p').innerText = d6_talismanN ? `${d6_talismanN.toLocaleString()}個 ➔ ${d6_talismanPt.toLocaleString()} pt` : '';
  document.getElementById('d6_tsubo-p').innerText = d6_tsuboN ? `${d6_tsuboN.toLocaleString()}個 ➔ ${d6_tsuboPt.toLocaleString()} pt` : '';

  // --- 全体合計 ---
  const grandTotal = d1_total + d2_total + d3_total + d4_total + d5_total + d6_total;

  document.getElementById('total-pt').innerText = Math.floor(grandTotal).toLocaleString();
  document.getElementById('total-man').innerText = `（約 ${(grandTotal / 10000).toFixed(2)} 万pt）`;
}

window.onload = function() {
  loadInputs();
  calc();
};
