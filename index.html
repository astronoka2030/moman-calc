<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧮 同盟対決ポイント計算機</title>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-H1Z9NHRJ19"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-H1Z9NHRJ19');
</script>

<!-- 外部CSSファイルの読み込み -->
<link rel="stylesheet" href="style.css">
</head>
<body>

<h2>🧮 同盟対決ポイント計算機</h2>

<!-- 技巧ボーナス設定エリア（アコーディオン対応） -->
<div class="bonus-wrapper" id="bonus-wrapper">
  <div class="bonus-title" onclick="toggleBonus()">
    <span>技巧ボーナス設定</span>
  </div>
  <div id="bonus-container" class="bonus-card"></div>
</div>


<!-- 各日エリア -->
<div id="days-container"></div>

<!-- 合計固定フッター -->
<div class="result-box">
  <div class="result-title">
    <span>全6日間 合計獲得予定ポイント</span>
    <button class="reset-btn" onclick="clearAll()">リセット</button>
  </div>
  <div class="result-val"><span id="total-pt">0</span> pt</div>
  <div class="result-man" id="total-man">（約 0 万pt）</div>
</div>

<div id="image-modal" class="modal-overlay" onclick="closeModal()">
  <img id="modal-img" src="" alt="確認用画像">
</div>

<!-- 外部JSファイルの読み込み -->
<script src="script.js"></script>
</body>
</html>
